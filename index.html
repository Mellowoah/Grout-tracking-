<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<meta name="apple-mobile-web-app-title" content="Grout">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Grout Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--tray:#0d1b2a;--bg:#fff;--ink:#0d1b2a;--mut:#4a5a6a;--line:#c9d1d9;--acc:#ffd100;--accink:#0d1b2a;--red:#d00000;--card:#f2f4f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1118;--ink:#f4f6f8;--mut:#9fb0bf;--line:#2b3946;--card:#16212b;--red:#ff5a5a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1118;--ink:#f4f6f8;--mut:#9fb0bf;--line:#2b3946;--card:#16212b;--red:#ff5a5a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.35 Barlow,system-ui,sans-serif;padding-bottom:calc(290px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.num{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:800}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:9;padding:8px 12px;border-bottom:2px solid var(--ink)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--card);padding:6px 8px;border-radius:6px}.stat small{color:var(--mut);display:block}.stat b{font-size:22px}
#alert{display:none;background:var(--red);color:#fff;padding:10px 12px;font-weight:700;font-size:18px}
#save{font-size:13px;color:var(--mut);margin-top:4px}
main{padding:10px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
button{font:700 18px Barlow,system-ui,sans-serif;min-height:56px;border:2px solid var(--ink);border-radius:8px;background:var(--acc);color:var(--accink);padding:8px}
button.sec{background:var(--card);color:var(--ink)}button:active{transform:scale(.97);filter:brightness(.9)}
h2{font:800 22px "Barlow Condensed",system-ui,sans-serif;margin:18px 0 6px}
.card{background:var(--card);border-radius:8px;padding:10px;margin:8px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
input{font:500 16px Barlow,system-ui,sans-serif;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.row input{flex:1;min-width:90px}.flag{color:var(--red);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:4px;border-bottom:1px solid var(--line);text-align:left}
.wrap{overflow-x:auto}
#tray{position:fixed;left:0;right:0;bottom:0;background:var(--tray);color:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:9}
#tray.min #trayBody{display:none}
#tray .top{display:flex;justify-content:space-between;align-items:center}
#cnt{font-size:56px;line-height:1}
#plus{width:100%;min-height:96px;font-size:44px;margin-top:8px}
.tl{font-size:14px;border-left:3px solid var(--acc);padding-left:8px;margin:6px 0}
#msg{background:var(--acc);color:var(--accink);padding:8px 10px;font-weight:700;border-radius:6px;margin-top:6px}
.trayw{color:#ffd100;font-weight:700;font-size:14px;margin-top:4px}
label small{display:block;color:var(--mut)}
</style>
</head><body>

<div id="alert"></div>
<header><div class="stat" id="stat"></div><div id="save">Loading…</div><div id="msg" hidden></div><button id="undoNP" class="sec" hidden style="width:100%;margin-top:6px;min-height:44px" onclick="A.undoPile()">Undo new pile</button></header>
<main id="app"></main>
<div id="tray"><div class="top"><div><small>Pile <span id="tp"></span> · strokes</small><div class="num" id="cnt">0</div></div>
<div class="row" style="flex-wrap:nowrap"><button class="sec" id="undo" style="font-size:16px;padding:6px 10px">Undo stroke</button><button class="sec" style="font-size:16px;padding:6px 10px" onclick="A.newPile()" aria-label="Finish pile and start next">Next pile ▸</button><button class="sec" style="padding:6px 10px" id="fold" aria-label="Fold counter">▾</button></div></div>
<div id="tnone" class="trayw" hidden>No truck feeding: these strokes won't count toward any truck</div>
<div id="trayBody"><div style="margin-top:6px">Next mark <b class="num" id="tnext" style="font-size:28px"></b> · <small id="tint"></small></div><div class="row" style="flex-wrap:nowrap;margin-top:6px"><button id="plus" style="flex:2;width:auto;margin-top:0">+1</button><button id="tmark" style="flex:1;min-height:96px" onclick="A.mark()">Mark depth</button></div></div></div>
<input type="file" id="camIn" accept="image/*" hidden>
<div id="scanv" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:31;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 24px"></div>
<div id="formv" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 8px 24px"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
<script>
const KEY='groutTracker.v1';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const today=()=>new Date().toLocaleDateString([],{month:'numeric',day:'numeric',year:'2-digit'});
const blankPile=()=>({key:uid(),id:'',wall:'',date:today(),elev:'',station:'',st:{},opCount:'',reviewed:'',note:'',marks:[20,15,10,5,0],mi:0,len:23});
let S={pile:blankPile(),strokes:0,segStart:0,pumping:false,active:null,trucks:[],ev:[],piles:[],cal:'',limit:120,sampleYd:1.1,drillMin:3,reinfMin:15,warned:{},orphan:0};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.pile=Object.assign(blankPile(),{key:''},S.pile||{});S.pile.st=S.pile.st||{};
if(S.drillMin==null)S.drillMin=3;if(!S.calUnit){S.calUnit='ft3';if(S.cal==='')S.cal='0.86'}
// Pump output per stroke in yd³ (setting can be entered in ft³ or yd³)
const calYd=()=>{const c=parseFloat(S.cal);return c>0?(S.calUnit==='ft3'?c/27:c):NaN};if(S.reinfMin==null)S.reinfMin=15;
S.piles=S.piles||[];S.ev=S.ev||[];S.trucks=S.trucks||[];S.orphan=S.orphan||0;S.warned=S.warned||{};
// Older records: tag each event with the pile it belongs to (piles are separated by new_pile events)
if(!S.pile.key||S.ev.some(e=>!e.pk)){let n=0;for(const e of S.ev){if(e.type==='new_pile')n++;if(!e.pk)e.pk='p'+n}S.piles.forEach((p,i)=>{if(!p.key)p.key='p'+i});if(!S.pile.key)S.pile.key='p'+n}
// Trucks: per-pile strokes/used yd³, carry-in, leftover handling
S.trucks.forEach(t=>{t.used=t.used||{};t.carryIn=t.carryIn||{};t.left=t.left||'';t.samples=t.samples||[];t.tests=t.tests||[];
 if(!t.pk0){const a=S.ev.find(e=>e.type==='truck_arrival'&&e.truck===t.id);t.pk0=a?a.pk:S.pile.key}
 if(!t.ps)t.ps={[t.pk0]:t.strokes||0};if(t.waste&&!t.wastePk)t.wastePk=t.pk0});
const $=id=>document.getElementById(id);
// Next pile number: 42 → 43, P-09 → P-10; blank if the last one had no number
const nextId=id=>{const m=String(id||'').match(/^(.*?)(\d+)$/);if(!m)return'';const n=String(+m[2]+1);return m[1]+n.padStart(m[2].length,'0')};
const ft=ms=>ms?new Date(ms).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));$('save').textContent='Saved on this phone '+ft(Date.now())}catch(e){$('save').textContent='Not saved: storage unavailable'}}
let undoSnap=null,undoT;function showUndoPile(){const u=$('undoNP');u.hidden=false;clearTimeout(undoT);undoT=setTimeout(()=>{u.hidden=true;undoSnap=null},20000)}
let msgT;function msg(t){const m=$('msg');m.textContent=t;m.hidden=false;clearTimeout(msgT);msgT=setTimeout(()=>m.hidden=true,6000)}
function log(type,data){const e={id:uid(),type,t:Date.now(),entered:Date.now(),pile:S.pile.id,pk:S.pile.key,strokes:S.strokes,...data};S.ev.push(e);return e}
function pev(type,key=S.pile.key){return S.ev.filter(e=>e.pk===key&&(!type||e.type===type))}
function tk(id){return S.trucks.find(t=>t.id===id)}
const tname=t=>t?(t.num||'#'+t.seq):'';
function vib(){try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
const seg=()=>Math.max(0,S.strokes-S.segStart);
function tStrokes(t){return t.strokes+(S.active===t.id?seg():0)}
function strokesOn(t,pk){return (t.ps[pk]||0)+(S.active===t.id&&pk===S.pile.key?seg():0)}
// Close the feeding truck's current stroke segment onto this pile
function closeSeg(){const t=tk(S.active);if(t){const d=seg();t.strokes+=d;t.ps[S.pile.key]=(t.ps[S.pile.key]||0)+d}S.segStart=S.strokes}
const r1=v=>(Math.abs(v)<0.05?0:v).toFixed(1);
const num=v=>v===undefined||v===null||v===''?null:(parseFloat(v)||0);
// Used yd³ on one pile: typed amount wins, else strokes × calibration
// Strokes confirmed with the contractor: agreed total, else contractor count, else my count
const pileRec=pk=>pk===S.pile.key?{...S.pile,strokes:S.strokes}:(S.piles.find(p=>p.key===pk)||{});
function confStrokes(pk){const r=pileRec(pk),a=num(r.reviewed),o=num(r.opCount);return a!==null?{n:a,src:'agreed total'}:o!==null?{n:o,src:'contractor count'}:{n:r.strokes||0,src:'my count'}}
// Each truck's share of the pile = its strokes on my counter, scaled to the confirmed total
function confOn(t,pk){const n=strokesOn(t,pk),my=pileRec(pk).strokes||0,c=confStrokes(pk).n;return my>0?n*c/my:n}
function usedOn(t,pk){const m=num(t.used[pk]);if(m!==null)return m;const n=confOn(t,pk);if(!n)return 0;const c=calYd();return c>0?n*c:null}
function usedAll(t){let tot=0;for(const k of new Set([...Object.keys(t.ps),...Object.keys(t.used),...(S.active===t.id?[S.pile.key]:[])])){const u=usedOn(t,k);if(u===null)return null;tot+=u}return tot}
const pname=k=>k===S.pile.key?S.pile.id:((S.piles.find(p=>p.key===k)||{}).id||'?');
// Stage times: anything tapped/typed wins; gaps are filled from the field rules
// drill start = drill finish − drillMin · grout start = drill finish · reinforce start = grout finish · reinforce finish = reinforce start + reinfMin
function stages(p=S.pile){const st=p.st||{},D=(S.drillMin||0)*60000,R=(S.reinfMin||0)*60000,o={};
 const set=(k,v)=>{if(o[k])return;if(st[k])o[k]={t:st[k],est:false};else if(v)o[k]={t:v,est:true}};
 for(const k in st)if(st[k])o[k]={t:st[k],est:false};
 for(let i=0;i<3;i++){const g=k=>o[k]&&o[k].t;
  set('drillFinish',g('groutStart')||(g('drillStart')&&g('drillStart')+D));set('drillStart',g('drillFinish')&&g('drillFinish')-D);set('groutStart',g('drillFinish'));
  set('groutFinish',g('reinfStart')||(g('reinfFinish')&&g('reinfFinish')-R));set('reinfStart',g('groutFinish')||(g('reinfFinish')&&g('reinfFinish')-R));set('reinfFinish',g('reinfStart')&&g('reinfStart')+R)}
 return o}
const hm=ms=>{if(!ms)return'';const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
// Truck must be used within S.limit minutes of its batch time
function cutoff(t){const b=t.batch||t.dispatch;if(!b)return null;const [h,m]=b.split(':').map(Number);const ref=t.arrived||Date.now();const d=new Date(ref);d.setHours(h,m,0,0);
 if(d.getTime()>ref+5*60000)d.setDate(d.getDate()-1); // batched before midnight, arrived after
 return d.getTime()+S.limit*60000}
function calc(t){const q=parseFloat(t.qty),placed=usedAll(t);
 const s=S.sampleYd||0,w=parseFloat(t.waste)||0;
 const rem=(placed!==null&&q>=0)?q-placed-s-w:null;return{placed,s,w,rem,q}}
// This pile's yardage: arrived + carried in − used − samples − waste = left on trucks
function ledger(pk=S.pile.key){const sum=f=>S.trucks.reduce((a,t)=>a+f(t),0);let pend=false;
 const arr=sum(t=>t.pk0===pk?(parseFloat(t.qty)||0):0),cin=sum(t=>(t.carryIn[pk]&&t.carryIn[pk].yd)||0);
 const used=sum(t=>{const u=usedOn(t,pk);if(u===null){pend=true;return 0}return u});
 const samp=S.trucks.filter(t=>t.pk0===pk).length*(S.sampleYd||0),waste=sum(t=>t.wastePk===pk?(parseFloat(t.waste)||0):0);
 return{arr,cin,used:pend?null:used,samp,waste,left:pend?null:arr+cin-used-samp-waste}}
function nextMark(){return S.pile.marks[S.pile.mi]}
function flash(el){el.style.outline='4px solid #fff';setTimeout(()=>el.style.outline='',120)}
function act(fn){fn();save();render()}
function band(a,b){return Math.min(a,b)+'–'+Math.max(a,b)+' ft'}
function bands(p=S.pile){const out=[];let prev=Number(p.len)||0;for(const m of p.marks){if(m!==prev)out.push(band(prev,m));prev=m}return out}
function intervals(p=S.pile){const L=Number(p.len)||0;let rows=[],prev={d:L,s:0,good:L,after:false};
 for(const e of pev('depth_mark',p.key)){
  if(e.missing){rows.push({band:band(prev.d,e.depth),cum:'',d:null,cnt:0,flag:'MISSING'});prev={d:e.depth,s:prev.s,good:prev.good,after:true};continue}
  const d=e.strokes-prev.s;
  rows.push(prev.after?{band:band(prev.d,e.depth),cum:e.strokes,d:null,cnt:d,flag:'COMBINED: '+d+' strokes over '+band(prev.good,e.depth)}:{band:band(prev.d,e.depth),cum:e.strokes,d,cnt:d,flag:''});
  prev={d:e.depth,s:e.strokes,good:e.depth,after:false}}
 return rows}

function tray(){const m=nextMark();$('tnext').textContent=m===undefined?'done':m+' ft';const last=pev('depth_mark').filter(e=>!e.missing).pop();$('tint').textContent='Since last mark: '+(S.strokes-(last?last.strokes:0))+' strokes';$('tnone').hidden=!!tk(S.active)}
let rT;function soon(){clearTimeout(rT);rT=setTimeout(render,400)}
function stroke(d){if(d<0&&S.strokes===0)return;S.strokes+=d;if(!tk(S.active))S.orphan=Math.max(0,S.orphan+d);if(d>0)vib();$('cnt').textContent=S.strokes;tray();save();if(d>0)autoHandoff();soon()}
// When the feeding truck's load (minus the sample allowance) is used up by strokes, stamp it empty and move to the next queued truck
function autoHandoff(){const t=tk(S.active);if(!t||!(calYd()>0)||!(parseFloat(t.qty)>0)||num(t.used[S.pile.key])!==null)return;const c=calc(t);if(c.rem===null||c.rem>0)return;
 const nx=S.trucks.find(x=>!x.fed&&!x.emptied);A.empty(t.id);if(nx){A.sw(nx.id);msg('Truck '+tname(t)+' used up. Now feeding truck '+tname(nx)+'.')}else msg('Truck '+tname(t)+' used up and no truck queued. Strokes now count to no truck.');vib()}
$('plus').onclick=e=>{flash(e.target);stroke(1)};
$('undo').onclick=()=>stroke(-1);
$('fold').onclick=()=>{$('tray').classList.toggle('min');$('fold').textContent=$('tray').classList.contains('min')?'▴':'▾'};

const armed={};
function twoTap(k,btnId,label){if(Date.now()-(armed[k]||0)>4000){armed[k]=Date.now();const b=$(btnId);if(b)b.textContent=label||'Tap again to confirm';setTimeout(render,4200);return false}armed[k]=0;return true}
const A={
 newPile(){undoSnap=JSON.stringify(S);if(fc){clearInterval(fcT);fc=null}act(()=>{closeSeg();const open=S.trucks.filter(t=>!t.emptied).map(t=>{const c=calc(t);return[t,c.rem!==null?c.rem:(c.q>=0&&usedAll(t)===0?c.q:null)]});
  S.piles.push({...S.pile,strokes:S.strokes,done:Date.now()});const p=S.pile;S.pile={...blankPile(),id:nextId(p.id),wall:p.wall,station:p.station,marks:p.marks,len:p.len};S.strokes=0;S.segStart=0;log('new_pile');
  for(const [t,yd] of open){t.carryIn[S.pile.key]={from:p.key,yd};t.left='';log('truck_carry',{truck:t.id,yd})}
  msg('Pile '+(S.pile.id||'')+' started.'+(open.length?' '+open.map(([t,yd])=>'Truck '+tname(t)+': '+(yd==null?'?':r1(yd))+' yd³ left').join(', '):''))});showUndoPile()},
 undoPile(){if(!undoSnap)return;S=JSON.parse(undoSnap);undoSnap=null;$('undoNP').hidden=true;save();render();msg('Back on pile '+S.pile.id+'. Nothing was lost.')},
 pump(){act(()=>{S.pumping=!S.pumping;log(S.pumping?'pump_start':'pump_pause')})},
 arrive(){act(()=>{const t={id:uid(),seq:S.trucks.length?Math.max(...S.trucks.map(x=>x.seq||0))+1:1,num:'',sampleNo:'',qty:'',batch:'',dispatch:'',arrived:Date.now(),emptied:null,strokes:0,samples:[],waste:'',tests:[],pk0:S.pile.key,ps:{},used:{},carryIn:{},left:''};S.trucks.push(t);log('truck_arrival',{truck:t.id});vib()})},
 mark(){act(()=>{const d=nextMark();if(d===undefined)return msg('All depth marks for this pile are done.');log('depth_mark',{depth:d,truck:S.active});S.pile.mi++;vib()})},
 miss(){act(()=>{const d=nextMark();if(d===undefined)return;log('depth_mark',{depth:d,missing:true,truck:S.active});S.pile.mi++})},
 ret(){act(()=>{log('grout_return',{depth:null,source:''})})},
 sw(id){const t=tk(id);if(!t)return msg('No truck waiting. Tap Truck arrival first.');act(()=>{const o=tk(S.active);closeSeg();S.active=id;S.segStart=S.strokes;t.fed=true;log('truck_switch',{truck:id,from:o?o.id:null,depth:nextMark()??null})})},
 next(){const t=S.trucks.find(t=>!t.fed&&!t.emptied);if(!t)return msg('No truck waiting. Tap Truck arrival first.');A.sw(t.id)},
 empty(id){act(()=>{const t=tk(id);if(S.active===id){closeSeg();S.active=null}t.emptied=Date.now();log('truck_empty',{truck:id})})},
 // Leftover on truck dumped: becomes waste on this pile and the truck is done
 waste(id){const t=tk(id),c=calc(t);if(c.rem===null)return msg('Enter the load and used yd³ first so the leftover can be worked out.');
  act(()=>{const e=log('truck_waste',{truck:id,yd:c.rem,prevWaste:t.waste,prevPk:t.wastePk||null,prevEmptied:t.emptied,prevActive:S.active===id});
   if(S.active===id){closeSeg();S.active=null}t.waste=String(+((parseFloat(t.waste)||0)+c.rem).toFixed(2));t.wastePk=S.pile.key;t.left='waste';if(!t.emptied)t.emptied=Date.now();msg(r1(c.rem)+' yd³ logged as waste on truck '+(tname(t)))})},
 carry(id){act(()=>{const t=tk(id);t.left=t.left==='carry'?'':'carry';if(t.left==='carry')msg('Truck '+tname(t)+' stays open. Its leftover moves to the next pile when you tap Start new pile.')})},
 setUsed(id,v){const t=tk(id);if(v==='')delete t.used[S.pile.key];else t.used[S.pile.key]=v;log('edit',{truck:id,field:'used',value:v});save();render()},
 setTime(id,f,v){const t=tk(id);if(!v){save();render();return}const [h,m]=v.split(':').map(Number);
  if(f==='emptied'&&!t.emptied){if(S.active===id){closeSeg();S.active=null}log('truck_empty',{truck:id})}
  const d=new Date(t[f]||t.arrived||Date.now());d.setHours(h,m,0,0);t[f]=d.getTime();log('edit',{truck:id,field:f,value:v});save();render()},
 remove(id){const t=tk(id);if(!t||t.fed||t.samples.length||t.tests.length)return;if(!twoTap('rm'+id,'rm'+id))return;act(()=>{S.trucks=S.trucks.filter(x=>x!==t);S.ev=S.ev.filter(e=>!(e.type==='truck_arrival'&&e.truck===id));msg('Truck removed')})},
 sample(id){act(()=>{const t=tk(id);const e=log('sample',{truck:id});t.samples.push(e.id)})},
 test(id){act(()=>{const t=tk(id);log('qc_test',{truck:id});t.tests.push({id:uid(),t:Date.now(),temp:'',flow:''})});setTimeout(()=>{const t=tk(id),e=t&&$('t-'+id+'-tt'+(t.tests.length-1));if(e)e.scrollIntoView({block:'center',behavior:'smooth'})},50)},
 undoLast(){const types=['depth_mark','truck_arrival','truck_empty','truck_waste','sample','grout_return','qc_test'];const e=[...pev()].reverse().find(x=>types.includes(x.type));if(!e)return msg('Nothing to undo on this pile.');
  const t=tk(e.truck),name=e.type.replace('_',' ');

 const box=(r)=>`<table style="background:#fff;color:#0d1b2a;margin-top:12px">`+r.map(([l,v])=>`<tr><td style="${lab('g')};text-align:center;min-width:90px;font-weight:600">${esc(l)}</td><td style="${cell};min-width:100px">${esc(v)}</td></tr>`).join('')+`</table>`;
 h+=`</table></div>`+box([['ARRIVED',L.arr+L.cin?(L.arr+L.cin).toFixed(1):''],['USED',L.used?f2(L.used):''],['ELEV',P.elev],['STATION',P.station]]);
 const comb=iv.filter(r=>r.flag.startsWith('COMBINED')),extra=[];
 for(const t of used){const ci=t.carryIn[P.key];if(ci)extra.push(['Truck '+tname(t)+' carried in from pile '+pname(ci.from),ci.yd==null?'?':r1(ci.yd)])}
 for(const t of used){const c=calc(t);extra.push(['Truck '+tname(t)+' left'+(t.left==='waste'?' (wasted)':t.emptied?'':' (carries to next pile)'),c.rem===null?'?':r1(c.rem)])}if(L.samp)extra.push(['Samples',L.samp.toFixed(1)]);if(L.waste)extra.push(['Waste',L.waste.toFixed(1)]);
 if(L.arr+L.cin)extra.push(['Left on trucks',f2(L.left)]);if(P.wall)extra.push(['Wall',P.wall]);if(P.opCount)extra.push(['My count / contractor',S.strokes+' / '+P.opCount]);
 comb.forEach(r=>extra.push(['Missed mark',r.flag.replace('COMBINED: ','')]));
 if(extra.length)h+=`<p style="color:var(--mut);margin:14px 0 0">Not on the paper sheet:</p>`+box(extra);
 h+=`<p style="color:var(--mut)">${anyEst?'* Filled in from drill / reinforce timing rules. ':''}Blank means not logged yet. ? means a reading is missing. Screenshot this screen to save or share it.</p>`;
 const el=$('formv');el.innerHTML=h;el.style.display='block'}
async function offer(filename,data,fallback){let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
 if(dl){try{await dl.save({filename,data});msg('Saved '+filename)}catch(e){msg(e&&e.code==='declined'?'Save cancelled.':'Could not save the file here. Use View paper form and take a screenshot.')}return}
 try{fallback()}catch(e){msg('Could not save the file here. Use View paper form and take a screenshot.')}}
function stamp(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function exportX(){if(typeof XLSX==='undefined')return msg('Excel export needs a connection to load. Try again with signal.');try{const ex=v=>v?new Date(v).toISOString():'';const P=S.pile;
 const ev=S.ev.map(e=>({ID:e.id,Type:e.type,EventTime:new Date(e.t).toISOString(),EnteredTime:new Date(e.entered).toISOString(),Pile:e.pile,Truck:tk(e.truck)?.num||e.truck||'',DepthFt:e.depth??'',CumStrokes:e.strokes,Missing:e.missing?'MISSING':''}));
 const tr=S.trucks.map(t=>{const c=calc(t);return{ID:t.id,Seq:t.seq,TruckID:t.num,SampleNo:t.sampleNo||'',TicketNo:t.ticketNo||'',Mix:t.mix||'',TicketPhoto:t.photo?'on phone':'',LoadYd3:t.qty,Batch:t.batch||t.dispatch,Arrived:new Date(t.arrived).toISOString(),Emptied:t.emptied?new Date(t.emptied).toISOString():'',CutoffEst:cutoff(t)?new Date(cutoff(t)).toISOString():'',Strokes:tStrokes(t),UsedYd3:c.placed??'PENDING',SamplesYd3:c.s,WasteYd3:c.w,LeftOnTruckYd3:c.rem??'UNRESOLVED',Leftover:t.left==='waste'?'WASTED':t.emptied?'':'ON TRUCK',Tests:t.tests.map(x=>x.temp+'F/'+x.flow+'s@'+ft(x.t)).join('; ')}});
 const all=[...S.piles,{...P,strokes:S.strokes}];
 const pr=a=>{const V=stages(a),x=k=>ex(V[k]&&V[k].t);return{Pile:a.id,Wall:a.wall,Date:a.date,LengthFt:a.len,Elev:a.elev,Station:a.station,DrillStart:x('drillStart'),DrillFinish:x('drillFinish'),GroutStart:x('groutStart'),GroutFinish:x('groutFinish'),ReinforceStart:x('reinfStart'),ReinforceFinish:x('reinfFinish'),AutoFilledStages:Object.keys(V).filter(k=>V[k].est).join(' '),MyStrokes:a.strokes,OperatorCount:a.opCount,ReviewedTotal:a.reviewed,Explanation:a.note}};
 const iv=all.flatMap(p=>intervals(p).map(r=>({Pile:p.id,Band:r.band,CumStrokes:r.cum,Strokes:r.d??'',Flag:r.flag})));
 const wb=XLSX.utils.book_new();[['Events',ev],['Trucks_QC',tr],['Piles',all.map(pr)],['Intervals',iv],['Truck_by_pile',S.trucks.flatMap(t=>[...new Set([...Object.keys(t.ps),...Object.keys(t.used),...Object.keys(t.carryIn)])].map(k=>({Truck:t.num||'#'+t.seq,Pile:pname(k),CarriedInYd3:t.carryIn[k]?(t.carryIn[k].yd??'?'):'',Strokes:strokesOn(t,k),ConfirmedStrokes:+confOn(t,k).toFixed(1),StrokeSource:confStrokes(k).src,UsedYd3:usedOn(t,k)??'PENDING',UsedSource:num(t.used[k])!==null?'typed':'strokes x cal',WasteYd3:t.wastePk===k?(parseFloat(t.waste)||0):''})))],
 ['Pile_yardage',all.map(p=>{const L=ledger(p.key);return{Pile:p.id,ArrivedYd3:L.arr,CarriedInYd3:L.cin,UsedYd3:L.used??'PENDING',SamplesYd3:L.samp,WasteYd3:L.waste,LeftOnTrucksYd3:L.left??'PENDING'}})]].forEach(([n,d])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.length?d:[{}]),n));
 const name='grout-'+stamp()+(P.id?'-pile-'+P.id.replace(/[^\w-]/g,''):'')+'.xlsx';
 const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
 offer(name,new Blob([buf]),()=>XLSX.writeFile(wb,name))}catch(e){msg('Export failed: '+e.message)}}
function backup(){const json=JSON.stringify(S),name='grout-backup-'+stamp()+'.json';
 offer(name,json,()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;a.click()})}
// ---- Ticket scanning: photo -> on-phone text reading (Tesseract, files in ./ocr) -> review -> apply
let scanFor=null,ocrW=null,scanRes=null;
function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
async function ocrWorker(prog){if(ocrW)return ocrW;await loadScript('ocr/tesseract.min.js');const base=new URL('ocr/',location.href).href;
 ocrW=await Tesseract.createWorker('eng',1,{workerPath:base+'worker.min.js',corePath:base,langPath:base.replace(/\/$/,''),workerBlobURL:false,logger:m=>{if(m.status==='recognizing text')prog(Math.round(m.progress*100))}});return ocrW}
// Downscale + grayscale + stretch contrast: smaller photo to store, cleaner text to read
function prepImage(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,2000/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
 const keep=document.createElement('canvas');const k2=Math.min(1,1400/Math.max(c.width,c.height));keep.width=Math.round(c.width*k2);keep.height=Math.round(c.height*k2);keep.getContext('2d').drawImage(c,0,0,keep.width,keep.height);
 const d=x.getImageData(0,0,c.width,c.height),a=d.data;let lo=255,hi=0;for(let i=0;i<a.length;i+=4){const g=.299*a[i]+.587*a[i+1]+.114*a[i+2];a[i]=g;if(g<lo)lo=g;if(g>hi)hi=g}const r=Math.max(1,hi-lo);
 for(let i=0;i<a.length;i+=4){const g=Math.max(0,Math.min(255,(a[i]-lo)*255/r));a[i]=a[i+1]=a[i+2]=g}x.putImageData(d,0,0);URL.revokeObjectURL(img.src);keep.toBlob(b=>res({ocr:c,photo:b}),'image/jpeg',.7)};img.onerror=()=>rej(new Error('image'));img.src=URL.createObjectURL(file)})}
// Pull fields out of the ticket text. Tickets differ by plant, so every value is shown for review before it is saved.
function parseTicket(text){const L=text.toUpperCase().split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean),out={},src={};
 const after=(lab,val,ok=()=>true,skip)=>{for(let i=0;i<L.length;i++){if(skip&&skip.test(L[i]))continue;const m=L[i].match(lab);if(!m)continue;const rest=L[i].slice(m.index+m[0].length)+' '+(L[i+1]||'');const v=rest.match(val);if(v&&ok(v))return{v,line:L[i]}}return null};
 const qn=v=>{const n=parseFloat(String(v).replace(',','.'));return n>=0.25&&n<=14?n:null};const QV=/(\d{1,2}(?:[.,]\d{1,2})?)/;
 let q=after(/THIS\s*LOAD|LOAD\s*(QTY|QUANTITY|SIZE|VOL(UME)?|AMOUNT)|QTY\s*(THIS\s*)?LOAD|DEL(IVERED)?\s*QTY|QTY\s*DEL(IVERED)?|LOADED/,QV,v=>qn(v[1])!==null,/ORDER|CUM|TOTAL|TO\s*DATE/);
 if(!q)for(const l of L){if(/ORDER|CUM|TOTAL|TO\s*DATE/.test(l))continue;const m=l.match(/(\d{1,2}(?:[.,]\d{1,2})?)\s*(CY|C\.Y|CYD|YD3|YDS?\b|CU\.?\s*YDS?|CUBIC\s*YARDS?)/);if(m&&qn(m[1])!==null){q={v:m,line:l};break}}
 if(!q)q=after(/\bQTY\b|QUANTITY/,QV,v=>qn(v[1])!==null,/ORDER|CUM|TOTAL|TO\s*DATE/);
 if(q){out.qty=String(qn(q.v[1]));src.qty=q.line}
 const id=(lab,len,k)=>{const r=after(lab,new RegExp('^\\W{0,4}([A-Z0-9][A-Z0-9-]{'+(len[0]-1)+','+(len[1]-1)+'})\\b'),v=>/\d/.test(v[1]));if(r){out[k]=r.v[1];src[k]=r.line}};
 id(/TRUCK\s*(NO|NUMBER|ID|#)?\.?/,[1,8],'num');id(/TICKET\s*(NO|NUMBER|#)?\.?/,[3,12],'ticketNo');id(/MIX\s*(DESIGN|CODE|ID|NO|#)?\.?/,[2,14],'mix');id(/SAMPLE\s*(NO|NUMBER|ID|#)?\.?/,[1,10],'sampleNo');
 const TV=/(\d{1,2})\s?[:.]\s?(\d{2})\s*([AP])?\.?\s?M?\b/;const tm=v=>{let h=+v[1],m=+v[2];if(h>23||m>59)return null;if(v[3]==='P'&&h<12)h+=12;if(v[3]==='A'&&h===12)h=0;if(!v[3]&&h>=1&&h<=5)h+=12;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')};
 let b=after(/BATCH|LOAD(ED)?\s*TIME|TIME\s*LOADED|PLANT\s*TIME|TIME\s*OUT|LEFT\s*PLANT|LEAVE\s*PLANT|DISPATCH/,TV,v=>!!tm(v));
 if(!b)for(const l of L){const v=l.match(TV);if(v&&tm(v)){b={v,line:l,guess:true};break}}
 if(b){out.batch=tm(b.v);src.batch=b.line+(b.guess?' (first time on ticket)':'')}
 return{out,src}}
const SCF=[['num','Truck I.D. #',''],['qty','Load yd³','decimal'],['batch','Batch time','time'],['ticketNo','Ticket #',''],['mix','Mix',''],['sampleNo','Sample #','']];
function scanShow(h){const el=$('scanv');el.innerHTML=h;el.style.display='block'}
function scanClose(){$('scanv').style.display='none';$('scanv').innerHTML='';scanRes=null;render()}
$('camIn').onchange=async e=>{const f=e.target.files&&e.target.files[0],t=tk(scanFor);if(!f||!t)return;
 scanShow(`<h2>Reading ticket for truck ${esc(tname(t))}</h2><div class="card" id="scanst">Preparing photo…</div>`);
 let prep;try{prep=await prepImage(f)}catch(_){scanShow(`<div class="card flag">Couldn't open that photo. Try again.</div><button onclick="scanClose()">Close</button>`);return}
 const id=t.id;try{await putPhoto(id,prep.photo);t.photo=true;save()}catch(_){}
 let text='',err='';try{const w=await ocrWorker(p=>{const s=$('scanst');if(s)s.textContent='Reading ticket… '+p+'%'});const st=$('scanst');if(st)st.textContent='Reading ticket…';const r=await w.recognize(prep.ocr);text=r.data.text||''}catch(x){err=navigator.onLine?'Couldn\'t read the ticket.':'Reading tickets needs signal the first time, to load the reader onto this phone.'}
 const {out,src}=text?parseTicket(text):{out:{},src:{}};scanRes={id,out};
 const n=Object.keys(out).length;
 scanShow(`<h2>Ticket for truck ${esc(tname(t))}</h2>${err?`<div class="card flag">${err} The photo is saved. Type the numbers below.</div>`:`<div class="card">${n?`Found ${n} item${n>1?'s':''}. Check each one, fix anything wrong, then tap Use these.`:'Couldn\'t pick out any values. The photo is saved. Type the numbers below, or retake the photo flatter and closer.'}</div>`}
 ${SCF.map(([k,l,ty])=>{const cur=t[k]||'',v=out[k]??cur;return `<div class="card"><label><small>${l}${src[k]?' · found on ticket':cur?' · already entered':''}</small><input id="sc-${k}" ${ty==='time'?'type="time"':ty==='decimal'?'inputmode="decimal"':''} value="${esc(v)}" style="${src[k]?'border:2px solid var(--acc)':''}"></label>${src[k]?`<small style="color:var(--mut)">“${esc(src[k])}”</small>`:''}${out[k]!=null&&cur&&cur!==out[k]?`<small class="flag"> Was ${esc(cur)}</small>`:''}</div>`}).join('')}
 <div class="row"><button style="flex:2" onclick="scanApply()">Use these</button><button class="sec" style="flex:1" onclick="scanClose()">Cancel</button></div>
 <img id="scimg" style="width:100%;margin-top:10px;border-radius:8px" alt="Ticket photo">
 ${text?`<details style="margin-top:8px"><summary>Text read from the ticket</summary><pre style="white-space:pre-wrap;font-size:13px">${esc(text)}</pre></details>`:''}`);
 $('scimg').src=URL.createObjectURL(prep.photo)};
function scanApply(){const t=scanRes&&tk(scanRes.id);if(!t)return scanClose();
 for(const [k] of SCF){const v=$('sc-'+k).value.trim();if(v!==(t[k]||'')){t[k]=v;log('edit',{truck:t.id,field:k,value:v,source:'ticket scan'})}}
 log('ticket_scan',{truck:t.id});save();msg('Ticket saved to truck '+tname(t));scanClose()}
function pdb(){return new Promise((res,rej)=>{const r=indexedDB.open('groutPhotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putPhoto(id,blob){const db=await pdb();return new Promise((res,rej)=>{const tx=db.transaction('p','readwrite');tx.objectStore('p').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function getPhoto(id){const db=await pdb();return new Promise((res,rej)=>{const q=db.transaction('p').objectStore('p').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function viewPhoto(id){let b=null;try{b=await getPhoto(id)}catch(_){}const t=tk(id);
 scanShow(`<div class="row"><button onclick="scanClose()">Close</button></div><h2>Ticket · truck ${esc(tname(t))}</h2>${b?'<img id="scimg" style="width:100%;border-radius:8px" alt="Ticket photo">':'<div class="card flag">Photo not found on this phone.</div>'}`);if(b)$('scimg').src=URL.createObjectURL(b)}
function tick(){const now=Date.now();let worst=null;
 for(const t of S.trucks){if(t.emptied)continue;const co=cutoff(t);if(!co)continue;const r=co-now;if(r<=600000&&(!worst||r<worst.r))worst={t,r,co}}
 const a=$('alert');if(!worst){a.style.display='none';return}
 a.style.display='block';
 if(worst.r<=0)a.textContent='▲ Truck '+(worst.t.num||'?')+' — Cutoff reached ('+ft(worst.co)+')';
 else{const m=Math.floor(worst.r/60000),s=Math.floor(worst.r/1000)%60;a.textContent='▲ Truck '+(worst.t.num||'?')+' — '+m+':'+String(s).padStart(2,'0')+' left · cutoff '+ft(worst.co)}
 if(!S.warned[worst.t.id]){S.warned[worst.t.id]=1;vib();save()}}
setInterval(tick,1000);render();tick();save();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
</script>
