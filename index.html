<style>

</head><body>

<div id="alert"></div>
<header><button id="allF" style="width:100%;min-height:44px;margin-bottom:6px;font-size:17px" onclick="showForm(allPiles()[0].key)">View all pile forms</button><div class="stat" id="stat"></div><div id="save">Loading…</div><div id="msg" hidden></div><button id="undoNP" class="sec" hidden style="width:100%;margin-top:6px;min-height:44px" onclick="A.undoPile()">Undo new pile</button></header>
<main id="app"></main>
<div id="tray"><div class="top"><div><small>Pile <span id="tp"></span> · live strokes</small><div class="num" id="cnt">0</div></div></div>
<button class="sec" id="fold" type="button" aria-label="Fold counter">Hide counter</button>
<div id="tnone" class="trayw" hidden>No truck feeding: these strokes won't count toward any truck</div>
<div id="trayBody"><button id="plus" type="button" aria-label="Add one stroke">+1</button>
<div class="row" style="flex-wrap:nowrap"><button class="sec" id="undoStroke" type="button" style="flex:1">Undo</button><button id="tmark" type="button" style="flex:1.3" onclick="A.mark()">Mark depth</button><button class="sec" id="tmiss" type="button" style="flex:1.2" onclick="A.miss()">Missed mark</button></div>
<small id="tint"></small></div></div>
<input type="file" id="camIn" accept="image/*" hidden><input type="file" id="formIn" accept="image/*" hidden><input type="file" id="impIn" accept=".json,application/json" hidden>
<div id="scanv" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:31;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 24px"></div>
<div id="formv" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 8px 24px"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
<script>
const KEY='groutTracker.v1';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const today=()=>new Date().toLocaleDateString([],{month:'numeric',day:'numeric',year:'2-digit'});
const blankPile=()=>({key:uid(),id:'',wall:'',date:today(),elev:'',station:'',st:{},opCount:'',reviewed:'',note:'',marks:[20,15,10,5,0],mi:0,len:23});
let S={pile:blankPile(),strokes:0,segStart:0,pumping:false,active:null,trucks:[],ev:[],piles:[],cal:'',limit:120,sampleYd:1.1,drillMin:3,reinfMin:15,warned:{},orphan:0};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.pile=Object.assign(blankPile(),{key:''},S.pile||{});S.pile.st=S.pile.st||{};
if(S.drillMin==null)S.drillMin=3;if(S.groutMin==null)S.groutMin=7;if(S.defLoad==null)S.defLoad=9;if(S.sampleEvery==null)S.sampleEvery=50;if(!S.calUnit){S.calUnit='ft3';if(S.cal==='')S.cal='0.86'}
// Pump output per stroke in yd³ (setting can be entered in ft³ or yd³)
const calYd=()=>{const c=parseFloat(S.cal);return c>0?(S.calUnit==='ft3'?c/27:c):NaN};if(S.reinfMin==null)S.reinfMin=15;
S.piles=S.piles||[];S.piles.forEach((p,i)=>{if(p.n==null)p.n=i});if(S.pile&&S.pile.n==null)S.pile.n=S.piles.length;S.ev=S.ev||[];S.trucks=S.trucks||[];S.orphan=S.orphan||0;S.warned=S.warned||{};
// Older records: tag each event with the pile it belongs to (piles are separated by new_pile events)
if(!S.pile.key||S.ev.some(e=>!e.pk)){let n=0;for(const e of S.ev){if(e.type==='new_pile')n++;if(!e.pk)e.pk='p'+n}S.piles.forEach((p,i)=>{if(!p.key)p.key='p'+i});if(!S.pile.key)S.pile.key='p'+n}
// Trucks: per-pile strokes/used yd³, carry-in, leftover handling
S.trucks.forEach(t=>{t.used=t.used||{};t.carryIn=t.carryIn||{};t.left=t.left||'';t.samples=t.samples||[];t.tests=t.tests||[];
 if(!t.pk0){const a=S.ev.find(e=>e.type==='truck_arrival'&&e.truck===t.id);t.pk0=a?a.pk:S.pile.key}
 if(!t.ps)t.ps={[t.pk0]:t.strokes||0};if(t.qty===''&&S.defLoad)t.qty=String(S.defLoad);if(t.waste&&!t.wastePk)t.wastePk=t.pk0});
const $=id=>document.getElementById(id);
// Next pile number: 42 → 43, P-09 → P-10; blank if the last one had no number
const nextId=id=>{const m=String(id||'').match(/^(.*?)(\d+)$/);if(!m)return'';const n=String(+m[2]+1);return m[1]+n.padStart(m[2].length,'0')};
const ft=ms=>ms?new Date(ms).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
function save(){const j=JSON.stringify(S);let ok=false;try{localStorage.setItem(KEY,j);ok=true}catch(e){}
 mirror(j);$('save').textContent=ok?'Saved on this phone '+ft(Date.now())+' · '+(S.piles.length+1)+' piles':'Not saved to main storage. Backup copy only: export now'}
let mirT;function mirror(j){clearTimeout(mirT);mirT=setTimeout(()=>{try{pdb().then(db=>{const tx=db.transaction('s','readwrite');tx.objectStore('s').put({t:Date.now(),j},'state')})}catch(e){}},300)}
let undoSnap=null,undoT;function showUndoPile(){const u=$('undoNP');u.hidden=false;clearTimeout(undoT);undoT=setTimeout(()=>{u.hidden=true;undoSnap=null},20000)}
let msgT;function msg(t){const m=$('msg');m.textContent=t;m.hidden=false;clearTimeout(msgT);msgT=setTimeout(()=>m.hidden=true,6000)}
function log(type,data){const e={id:uid(),type,t:Date.now(),entered:Date.now(),pile:S.pile.id,pk:S.pile.key,strokes:S.strokes,...data};S.ev.push(e);return e}
function pev(type,key=S.pile.key){return S.ev.filter(e=>e.pk===key&&(!type||e.type===type))}
function tk(id){return S.trucks.find(t=>t.id===id)}
const tname=t=>t?(t.num||'#'+t.seq):'';
function vib(){try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
const seg=()=>Math.max(0,S.strokes-S.segStart);
function tStrokes(t){return t.strokes+(S.active===t.id?seg():0)}
function strokesOn(t,pk){return (t.ps[pk]||0)+(S.active===t.id&&pk===S.pile.key?seg():0)}
// Close the feeding truck's current stroke segment onto this pile
function closeSeg(){const t=tk(S.active);if(t){const d=seg();t.strokes+=d;t.ps[S.pile.key]=(t.ps[S.pile.key]||0)+d}S.segStart=S.strokes}
// About how many strokes a truck has left at the pump calibration
const sLeft=rem=>rem!==null&&calYd()>0?Math.max(0,Math.floor(rem/calYd())):null;
// Sample yd³ taken off a truck: its own value if set, else the Settings default
// Grout a truck brought into a pile = what it had left after the pile it came from (live, so later fixes flow through)
const cyd=(t,pk)=>{const c=t.carryIn&&t.carryIn[pk];if(!c)return null;const v=leftAfter(t,c.from);return v!==null?v:(c.yd??null)};
// Samples: one of S.sampleYd for every S.sampleEvery yd³ delivered that day (counting from yard 0), taken off the truck
// whose load crosses each mark. A value typed on a truck overrides this.
function autoSamples(){const out={},every=Number(S.sampleEvery)||0,at=t=>arrOf(t),day=t=>at(t)?new Date(at(t)).toDateString():new Date().toDateString(),cum={};
 const ts=[...S.trucks].sort((a,b)=>(at(a)||Infinity)-(at(b)||Infinity)||(a.seq||0)-(b.seq||0));
 for(const t of ts){const d=day(t),st=cum[d]||0,q=parseFloat(t.qty)||Number(S.defLoad)||0,en=st+q;cum[d]=en;
  let n=0;if(every>0){for(let k=Math.ceil(st/every)*every;k<en;k+=every)n++}else n=1;out[t.id]=n*(S.sampleYd||0)}return out}
// Sample yd³ off a truck. A typed amount wins. Otherwise each logged sample adds the default
// (1.1), and the day's 50 yd³ schedule still applies when nothing has been logged — so older
// records keep their sample. "Not taken" with no logged sample takes nothing off the truck.
function sy(t){const explicit=num(t.sampleYd);if(explicit!==null)return r3(explicit);
 const each=Number(S.sampleYd)||0,logged=(t.samples||[]).length;
 if(t.sampleRep&&t.sampleRep.v!=='taken'&&!logged)return 0;
 const auto=autoSamples()[t.id]||0;if(!logged)return r3(auto);
 const autoCount=each>0?Math.round(auto/each):0;return r3(Math.max(logged,autoCount)*each)}
const r3=v=>{const n=Number(v);return isFinite(n)?Math.round(n*1000)/1000:NaN}; // yardage math in thousandths
const th=v=>Math.round(Number(v)*1000);
const r1=v=>(Math.abs(v)<0.005?0:v).toFixed(3); // paper form, 3 decimals like the field sheet
const r2=v=>{const n=Number(v);if(!isFinite(n))return'';const x=Math.round((Math.abs(n)<0.005?0:n)*100)/100;return x.toFixed(2)}; // working screen, 2 decimals
// Shown equation is built from 2-decimal parts so the line the inspector reads adds up.
function ydEq(c,id){const cents=v=>Math.round((Number(v)||0)*100),f=n=>(n/100).toFixed(2);
 const attr=id?` id="${id}" data-left="${c.rem==null?'':c.rem}"`:'';
 const samp=f(cents(c.s)),waste=f(cents(c.w)),tail=sLeft(c.rem)!==null?' (~'+sLeft(c.rem)+' strokes)':'';
 if(!(c.q>=0)||c.placed==null)return `<div${attr}>Load ${c.q>=0?f(cents(c.q)):'<span class=flag>?</span>'} − used ${c.placed==null?'<span class=flag>?</span>':f(cents(c.placed))} − sample ${samp} − waste ${waste} = <b>left ${c.rem==null?'<span class=flag>?</span>':r2(c.rem)} yd³</b>${tail}</div>`;
 const L=cents(c.q)-cents(c.placed)-cents(c.s)-cents(c.w);
 return `<div${attr}>Load ${f(cents(c.q))} − used ${f(cents(c.placed))} − sample ${samp} − waste ${waste} = <b>left on truck ${f(L)} yd³</b>${tail}</div>`}
function sampleActionLabel(t){const each=Number(S.sampleYd)||0,logged=(t.samples||[]).length,explicit=num(t.sampleYd);
 if(explicit!==null)return 'Sample taken (uses the '+r2(explicit)+' yd³ typed below)';
 const auto=autoSamples()[t.id]||0,autoCount=each>0?Math.round(auto/each):0;
 if(logged>=autoCount)return 'Sample taken (−'+r2(each)+' yd³)';
 return 'Sample taken ('+r2(auto||each)+' yd³ already off this truck)'}
const num=v=>v===undefined||v===null||v===''?null:(parseFloat(v)||0);
// Used yd³ on one pile: typed amount wins, else strokes × calibration
// Strokes confirmed with the contractor: agreed total, else contractor count, else my count
// Piles in the order they were worked (you can reopen an older pile, so the current one isn't always last)
const allPiles=()=>[...S.piles,S.pile].sort((a,b)=>(a.n??0)-(b.n??0));
const orderKeys=()=>allPiles().map(p=>p.key);
const maxN=()=>Math.max(...allPiles().map(p=>p.n??0));
const isLatest=()=>(S.pile.n??0)>=maxN();
const latestPile=()=>allPiles().slice(-1)[0];
const pileRec=pk=>pk===S.pile.key?{...S.pile,strokes:S.strokes}:(S.piles.find(p=>p.key===pk)||{});
const bandSum=r=>{const v=Object.values(r.bandIn||{}).filter(x=>x!==''&&x!=null).map(Number);return v.length?v.reduce((a,b)=>a+b,0):null};
const myCount=r=>{const m=num(r.myCount);return m!==null?m:(bandSum(r)??(r.strokes||0))};
function confStrokes(pk){const r=pileRec(pk),a=num(r.reviewed),o=num(r.opCount);return a!==null?{n:a,src:'agreed total'}:o!==null?{n:o,src:'contractor count'}:{n:myCount(r),src:'my count'}}
// Each truck's share of the pile = its strokes on my counter, scaled to the confirmed total
function confOn(t,pk){const n=strokesOn(t,pk),my=pileRec(pk).strokes||0,cs=confStrokes(pk);
 if(my>0)return n*cs.n/my;
 // I didn't count this pile but the contractor did: fill trucks in the order they fed it, each up to what it had on board
 if(cs.n>0)return (seqAlloc(pk)[t.id])||0;return n}
function feedOrder(pk){const seen=[],add=id=>{if(id&&tk(id)&&!seen.includes(id))seen.push(id)};
 for(const e of pev(null,pk))if(e.type==='truck_carry'||e.type==='truck_switch')add(e.truck);
 if(pk===S.pile.key)add(S.active);
 // then trucks that were on site for this pile (arrived or carried in) as overflow, in arrival order
 for(const e of pev(null,pk))if(e.type==='truck_arrival'||e.type==='truck_carry')add(e.truck);return seen}
function onBoard(t,pk){const order=orderKeys(),i=order.indexOf(pk),q=parseFloat(t.qty);if(!(q>=0))return Infinity;
 if(t.pk0===pk||i<=0)return q-sy(t);const prev=leftAfter(t,order[i-1]);return prev===null?Infinity:Math.max(0,prev)}
function seqAlloc(pk){const all=feedOrder(pk),c=confStrokes(pk).n,cy=calYd(),out={};let rest=c;
 // trucks with a typed used amount keep it; the rest of the strokes go to the others
 const ids=all.filter(id=>{const u=num(tk(id).used[pk]);if(u!==null&&cy>0){out[id]=u/cy;rest-=u/cy;return false}return true});rest=rest<0.5?0:rest; // under half a stroke is rounding
 ids.forEach((id,i)=>{const cap=cy>0?onBoard(tk(id),pk)/cy:Infinity,take=i===ids.length-1?rest:Math.min(rest,cap);out[id]=Math.max(0,take);rest-=out[id]});return out}
function usedOn(t,pk){const m=num(t.used[pk]);if(m!==null)return r3(m);const n=confOn(t,pk);if(!n)return 0;const c=calYd();return c>0?r3(n*c):null}
// Grout left on a truck at the end of a given pile (piles in the order worked).
// Each step is rounded to thousandths so 10 − 83×0.05 − 2.2 − 0.5 is 3.150, not a raw float.
const emptyOn=(t,k)=>pev(null,k).some(e=>e.truck===t.id&&(e.type==='truck_empty'||e.type==='truck_waste'));
function leftAfter(t,pk){const order=orderKeys(),idx=order.indexOf(pk),q=parseFloat(t.qty);if(idx<0||!(q>=0))return null;let rem=th(q)-th(sy(t));
 for(const k of order.slice(0,idx+1)){const x=usedOn(t,k);if(x===null)return null;rem-=th(x);if(t.wastePk===k)rem-=th(parseFloat(t.waste)||0)}
 return rem/1000}
// a truck is on a pile if something happened to it there (an edit to its details doesn't count)
const pileTrucks=pk=>S.trucks.filter(t=>pev(null,pk).some(e=>e.truck===t.id&&e.type!=='edit'));
function usedAll(t){let tot=0;for(const k of orderKeys()){const u=usedOn(t,k);if(u===null)return null;tot=r3(tot+u)}return tot}
const pname=k=>k===S.pile.key?S.pile.id:((S.piles.find(p=>p.key===k)||{}).id||'?');
// Stage times: anything tapped/typed wins; gaps are filled from the field rules
// drill start = drill finish − drillMin · grout start = drill finish · reinforce start = grout finish · reinforce finish = reinforce start + reinfMin
// Drill-start gap between piles today (from piles that have real times), used to place a pile with no times
function realDrill(p){const st=p.st||{},D=learnMin('drillStart','drillFinish','drillMin')*60000;return st.drillStart||(st.drillFinish&&st.drillFinish-D)||(st.groutStart&&st.groutStart-D)||null}
function seedDrill(p){const ps=allPiles(),i=ps.indexOf(ps.find(q=>q.key===p.key));if(i<0)return null;const rd=ps.map(realDrill),gaps=[];
 for(let j=1;j<ps.length;j++)if(rd[j]&&rd[j-1]&&rd[j]>rd[j-1])gaps.push(rd[j]-rd[j-1]);if(!gaps.length)return null;const g=gaps.reduce((a,b)=>a+b,0)/gaps.length;
 for(let j=i-1;j>=0;j--)if(rd[j])return Math.round((rd[j]+g*(i-j))/60000)*60000;for(let j=i+1;j<ps.length;j++)if(rd[j])return Math.round((rd[j]-g*(j-i))/60000)*60000;return null}
// Step lengths learned from today's real (typed/stamped) times; the Settings minutes are only used until a pile shows otherwise
function learnMin(a,b,fb){const today=new Date().toDateString(),v=allPiles().map(p=>p.st||{}).filter(st=>st[a]&&st[b]&&new Date(st[a]).toDateString()===today).map(st=>(st[b]-st[a])/60000).filter(x=>x>=0&&x<120);

 const cur={...S.pile,strokes:S.strokes,active:S.active,pumping:S.pumping};const curEmpty=!S.strokes&&!pev(null,S.pile.key).some(e=>!['new_pile','open_pile','truck_carry'].includes(e.type));
 let mine=[...S.piles,cur];const gone=new Set(mine.filter(p=>ids.has(p.id)).map(p=>p.key));let keepCur=!gone.has(cur.key)&&!curEmpty;if(!keepCur&&curEmpty)gone.add(cur.key);
 mine=mine.filter(p=>!gone.has(p.key));S.ev=S.ev.filter(e=>!gone.has(e.pk)).concat(D.ev);
 S.trucks=S.trucks.filter(t=>S.ev.some(e=>e.truck===t.id)).concat(D.trucks.filter(t=>!S.trucks.some(x=>x.id===t.id)));
 const nm=v=>{const x=parseFloat(v);return isNaN(x)?Infinity:x};let all2=[...mine,...inP].map((p,i)=>({p,i})).sort((a,b)=>nm(a.p.id)-nm(b.p.id)||a.i-b.i).map(x=>x.p);all2.forEach((p,i)=>p.n=i);
 const pick=keepCur?all2.find(p=>p.key===cur.key):all2[all2.length-1];S.piles=all2.filter(p=>p!==pick);
 S.pile=pick;S.strokes=pick.strokes||0;S.segStart=S.strokes;const at=tk(pick.active);S.active=at&&!at.emptied?at.id:null;S.pumping=false;delete pick.active;delete pick.pumping;
 S.trucks.forEach(t=>{t.used=t.used||{};t.carryIn=t.carryIn||{};t.ps=t.ps||{};t.tests=t.tests||[];t.samples=t.samples||[]});
 log('import',{piles:[...ids].join(',')});save();return [...ids]}
function tick(){const now=Date.now();let worst=null;
 for(const t of S.trucks){if(t.emptied)continue;const co=cutoff(t);if(!co)continue;const r=co-now;if(r<=600000&&(!worst||r<worst.r))worst={t,r,co}}
 const a=$('alert');if(!worst){a.style.display='none';return}
 a.style.display='block';
 if(worst.r<=0)a.textContent='▲ Truck '+tname(worst.t)+' — Cutoff reached ('+ft(worst.co)+')';
 else{const m=Math.floor(worst.r/60000),s=Math.floor(worst.r/1000)%60;a.textContent='▲ Truck '+tname(worst.t)+' — '+m+':'+String(s).padStart(2,'0')+' left · cutoff '+ft(worst.co)}
 if(!S.warned[worst.t.id]){S.warned[worst.t.id]=1;vib();save()}}
setInterval(tick,1000);
// If main storage came back empty but the backup copy has records, restore them
(async()=>{let had=false;try{had=!!localStorage.getItem(KEY)}catch(e){}
 if(!had){try{const db=await pdb();const b=await new Promise(r=>{const q=db.transaction('s').objectStore('s').get('state');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
  if(b&&b.j){localStorage.setItem(KEY,b.j);location.reload();return}}catch(e){}}
 render();tick();save();preload()})();
async function preload(){const PK='groutTracker.preloaded';let done=[];try{done=JSON.parse(localStorage.getItem(PK)||'[]')}catch(e){}
 try{const r=await fetch('preload.json',{cache:'no-store'});if(!r.ok)return;const J=await r.json();for(const D of (J&&J.list)||[J])await preloadOne(D,done,PK)}catch(e){}}
async function preloadOne(D,done,PK){try{if(!D||!D.preloadId||done.includes(D.preloadId))return;
  // a sheet read ahead of time: filled in exactly like Scan filled-in form, on whatever is on this phone
  if(D.sheetFill){const ids=[];for(const p of D.sheetFill){const v=aiToGrid(p);gotoPile(v.pid[0]);if(v.len){const L=parseFloat(v.len[0]);if(L>0)setLen(S.pile,L)}formGrid(v,'(read by Claude)','',null);formApply(false);ids.push(v.pid[0])}
   for(const [seq,pid] of D.moveTrucks||[]){const t=S.trucks.filter(x=>String(x.seq)===String(seq)).pop(),pp=allPiles().find(x=>x.id===pid);if(t&&pp)A.movePile(t.id,pp.key)}
   const L=latestPile();if(L.key!==S.pile.key)A.openPile(L.key);done.push(D.preloadId);localStorage.setItem(PK,JSON.stringify(done));save();render();msg('Loaded your sheet: piles '+ids.join(', ')+'. Now on pile '+(S.pile.id||'?')+'.');return}
  if(D.dropPiles){const notes=[];for(const [id,into] of D.dropPiles){const all=allPiles(),a=all.find(x=>x.id===id),b=all.find(x=>x.id===into);if(a&&b){armed['dp'+a.key]=Date.now();A.dropPile(a.key,b.key);notes.push('pile '+id+' removed (folded into '+into+')')}}
   done.push(D.preloadId);localStorage.setItem(PK,JSON.stringify(done));save();render();if(notes.length)msg(notes.join('; ')+'.');return}
  if(D.renamePiles){const notes=[];for(const [from,to] of D.renamePiles){const all=allPiles(),pf=all.find(x=>x.id===from);if(pf&&!all.some(x=>x.id===to)){pf.id=to;notes.push('pile '+from+' is now pile '+to)}}
   resortPiles();done.push(D.preloadId);localStorage.setItem(PK,JSON.stringify(done));save();render();msg((notes.join('; ')||'No pile to rename')+(D.note?' '+D.note:'')+'.');return}
  if(D.patch){const notes=[];for(const p of D.trucks||[]){let t=S.trucks.filter(x=>String(x.seq)===String(p.seq)).sort((a,b)=>(b.arrived||0)-(a.arrived||0))[0];
    if(!t&&p.add){A.addTruck();t=S.trucks[S.trucks.length-1];t.seq=p.seq;notes.push('added truck '+p.seq)}
    if(t&&p.batch&&t.batch!==p.batch){notes.push('truck '+p.seq+' batch '+(t.batch||'—')+' → '+p.batch);t.batch=p.batch;log('edit',{truck:t.id,field:'batch',value:p.batch,source:'patch'})}}
   done.push(D.preloadId);localStorage.setItem(PK,JSON.stringify(done));save();render();msg('Updated: '+(notes.join('; ')||'nothing to change')+'.');return}
  const ids=impMerge(D);done.push(D.preloadId);localStorage.setItem(PK,JSON.stringify(done));render();msg('Loaded your sheets: piles '+ids.join(', ')+'. Now on pile '+(S.pile.id||'?')+'.')}catch(e){}}
