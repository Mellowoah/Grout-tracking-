<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1118;--ink:#f4f6f8;--mut:#9fb0bf;--line:#2b3946;--card:#16212b;--red:#ff5a5a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1118;--ink:#f4f6f8;--mut:#9fb0bf;--line:#2b3946;--card:#16212b;--red:#ff5a5a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
/* no double-tap zoom when tapping fast (iPhone); inputs at 16px+ so typing doesn't zoom either */
html,body,button,a,label,summary{touch-action:manipulation}input,select,textarea{font-size:max(16px,1em)!important}#pv-tap,#plus{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--ink);font:500 16px/1.35 Barlow,system-ui,sans-serif;padding-bottom:calc(320px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.num{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:800}
button:disabled{opacity:.4}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:9;padding:8px 12px;border-bottom:2px solid var(--ink)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--card);padding:6px 8px;border-radius:6px}.stat small{color:var(--mut);display:block}.stat b{font-size:22px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
button{font:700 18px Barlow,system-ui,sans-serif;min-height:56px;border:2px solid var(--ink);border-radius:8px;background:var(--acc);color:var(--accink);padding:8px}
button.sec{background:var(--card);color:var(--ink)}button:active{transform:scale(.97);filter:brightness(.9)}
h2{font:800 22px "Barlow Condensed",system-ui,sans-serif;margin:18px 0 6px}
.card{background:var(--card);border-radius:8px;padding:10px;margin:8px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
input{font:500 16px Barlow,system-ui,sans-serif;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.row input{flex:1;min-width:90px}.flag{color:var(--red);font-weight:700}

label small{display:block;color:var(--mut)}

#cnt{font-size:30px}
#ctr::placeholder{font:600 18px Barlow,system-ui,sans-serif}

<div id="alert"></div><button id="errb" hidden style="width:100%;border-radius:0;background:var(--red);color:#fff;border:0;min-height:48px" onclick="reportOpen()">Something went wrong. Tap to send a report</button>
<header><button id="allF" style="width:100%;min-height:44px;margin-bottom:6px;font-size:17px" onclick="showForm(allPiles()[0].key)">View all pile forms</button><div class="stat" id="stat"></div><div id="save">Loading…</div><div id="msg" hidden></div><button id="undoNP" class="sec" hidden style="width:100%;margin-top:6px;min-height:44px" onclick="A.undoPile()">Undo new pile</button></header>
<main id="app"></main>
<div id="tray"><div class="top"><div><b style="font-size:20px">Pile <span id="tp"></span></b><div class="num" id="cnt">0</div></div>
<div class="row" style="flex-wrap:nowrap"><button class="sec" style="font-size:15px;padding:6px 8px;white-space:nowrap" onclick="endDayOpen()">End day</button><button class="sec" id="npTray" style="font-size:15px;padding:6px 8px;white-space:nowrap" onclick="A.newPile()" aria-label="Finish pile and start next">Next pile ▸</button><button class="sec" style="padding:6px 10px" id="fold" aria-label="Fold counter">▾</button></div></div>
<div id="tnone" class="trayw" hidden>No truck feeding: these strokes won't count toward any truck</div>
<div id="trayBody"><div style="margin-top:4px"><small id="tint"></small></div><div style="display:flex;gap:8px;margin-top:6px"><button class="sec" style="width:70px;font-size:22px" onclick="tapStroke(-1)" aria-label="Minus one stroke">−1</button><button id="plus" style="flex:1;margin-top:0;min-height:84px;font-size:30px" onclick="tapStroke(1)">+1 stroke</button></div></div></div>
<input type="file" id="camIn" accept="image/*" hidden><input type="file" id="formIn" accept="image/*" hidden><input type="file" id="impIn" accept=".json,application/json" hidden>
<div id="depv" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:32;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 24px;transition:background .1s"></div><div id="scanv" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:31;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 24px"></div>
<div id="formv" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 8px 24px"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
<script>
const PROF=(new URLSearchParams(location.search).get('profile')||'').replace(/[^\w-]/g,'').slice(0,20);
const KEY='groutTracker.v1'+(PROF?':'+PROF:'');const APPV='grout-v91';
// Problem reports go to this address (blank = the person picks who to send to)
const REPORT_TO='';
// Reports can also be opened as issues on the app's GitHub repo (GitHub emails the owner)
const REPO_ISSUES='https://github.com/Mellowoah/Grout-tracking-/issues/new';
// ---- Errors: kept on the phone (last 20) and offered as a one-tap report
const ERRK='groutTracker.errors'+(PROF?':'+PROF:'');let errNew=0;
function errList(){try{return JSON.parse(localStorage.getItem(ERRK)||'[]')}catch(e){return[]}}
function logErr(e,where){try{const l=errList();l.push({t:Date.now(),where:where||'',msg:String(e&&e.message||e).slice(0,300),at:String(e&&e.stack||'').split('\n').slice(0,3).join(' | ').slice(0,300)});localStorage.setItem(ERRK,JSON.stringify(l.slice(-20)))}catch(_){}
 errNew++;try{const b=document.getElementById('errb');if(b)b.hidden=false}catch(_){}}
addEventListener('error',e=>{if(e.message&&!/ResizeObserver/.test(e.message))logErr(e.error||e.message,'page')});
addEventListener('unhandledrejection',e=>logErr(e.reason,'promise'));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const today=()=>new Date().toLocaleDateString([],{month:'numeric',day:'numeric',year:'2-digit'});
const blankPile=()=>({key:uid(),id:'',wall:'',date:today(),elev:'',station:'',st:{},opCount:'',reviewed:'',note:'',marks:[20,15,10,5,0],mi:0,len:23});
let rawAtLoad=null;try{rawAtLoad=localStorage.getItem('groutTracker.v1'+(PROF?':'+PROF:''))}catch(e){}
let S={pile:blankPile(),strokes:0,segStart:0,pumping:false,active:null,trucks:[],ev:[],piles:[],cal:'',limit:120,sampleYd:1.1,drillMin:3,reinfMin:15,warned:{},orphan:0};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.pile=Object.assign(blankPile(),{key:''},S.pile||{});S.pile.st=S.pile.st||{};
if(S.drillMin==null)S.drillMin=3;if(S.groutMin==null)S.groutMin=7;if(S.defLoad==null)S.defLoad=9;if(S.sampleEvery==null)S.sampleEvery=50;if(!S.calUnit){S.calUnit='ft3';if(S.cal==='')S.cal='0.86'}
// Pump output per stroke in yd³ (setting can be entered in ft³ or yd³)
const calYd=()=>{const c=parseFloat(S.cal);return c>0?(S.calUnit==='ft3'?c/27:c):NaN};if(S.reinfMin==null)S.reinfMin=15;
if(S.pile&&S.pile.dayStart&&!(S.piles||[]).length&&!(S.trucks||[]).length)S.pile.date=today();
S.piles=S.piles||[];S.piles.forEach((p,i)=>{if(p.n==null)p.n=i});if(S.pile&&S.pile.n==null)S.pile.n=S.piles.length;S.ev=S.ev||[];S.trucks=S.trucks||[];S.orphan=S.orphan||0;S.warned=S.warned||{};
// Older records: tag each event with the pile it belongs to (piles are separated by new_pile events)
if(!S.pile.key||S.ev.some(e=>!e.pk)){let n=0;for(const e of S.ev){if(e.type==='new_pile')n++;if(!e.pk)e.pk='p'+n}S.piles.forEach((p,i)=>{if(!p.key)p.key='p'+i});if(!S.pile.key)S.pile.key='p'+n}
// Trucks: per-pile strokes/used yd³, carry-in, leftover handling
S.trucks.forEach(t=>{t.used=t.used||{};t.carryIn=t.carryIn||{};t.left=t.left||'';t.samples=t.samples||[];t.tests=t.tests||[];
 if(!t.pk0){const a=S.ev.find(e=>e.type==='truck_arrival'&&e.truck===t.id);t.pk0=a?a.pk:S.pile.key}
 if(!t.ps)t.ps={[t.pk0]:t.strokes||0};if(t.qty===''&&S.defLoad)t.qty=String(S.defLoad);if(t.waste&&!t.wastePk)t.wastePk=t.pk0});
const $=id=>document.getElementById(id);
// Next pile number: 42 → 43, P-09 → P-10; blank if the last one had no number
const nextId=id=>{const m=String(id||'').match(/^(.*?)(\d+)$/);if(!m)return'';const n=String(+m[2]+1);return m[1]+n.padStart(m[2].length,'0')};
const ft=ms=>ms?new Date(ms).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
// ---- Undo / redo: every change is a step you can take back, as many times as you need (kept through reloads)
const HK='hist'+(PROF?':'+PROF:''),HMAX=80;let hist=[],fut=[],lastJ=null,histAt=0,noHist=false,histT;
const EVN={depth_mark:'depth mark',truck_arrival:'truck arrival',truck_onsite:'truck arrival',truck_empty:'truck empty',truck_waste:'leftover waste',sample:'sample',grout_return:'grout return',qc_test:'QC test',new_pile:'new pile',truck_carry:'carry over',stage:'step time',edit:'edit',truck_reject:'truck sent back'};
function histNote(j){if(lastJ===null||j===lastJ){lastJ=j;return}
 if(noHist){noHist=false;lastJ=j;return}
 const now=Date.now(),e=S.ev[S.ev.length-1],lab=histLabel||(e&&e.t>histAt&&now-e.t<3000?(EVN[e.type]||e.type.replace(/_/g,' ')):'edit');histLabel='';
 if(!(hist.length&&now-histAt<1200&&lab==='edit'&&hist[hist.length-1].lab==='edit'))hist.push({j:lastJ,lab,t:now});
 if(hist.length>HMAX)hist.shift();fut=[];histAt=now;lastJ=j;histSave()}
let histLabel='';
function histSave(){clearTimeout(histT);histT=setTimeout(()=>{try{pdb().then(db=>db.transaction('s','readwrite').objectStore('s').put({cur:lastJ,hist,fut},HK))}catch(e){}},800)}
function histLoad(){try{pdb().then(db=>{const q=db.transaction('s').objectStore('s').get(HK);q.onsuccess=()=>{const v=q.result;if(v&&(v.cur===lastJ||v.cur===rawAtLoad)&&!hist.length){hist=v.hist||[];fut=v.fut||[];render()}}})}catch(e){}}
function undoAll(){const h=hist.pop();if(!h)return msg('Nothing left to undo.');fut.push({j:lastJ,lab:h.lab});histRestore(h.j);msg('Undid '+h.lab+'. '+(hist.length?hist.length+' more step'+(hist.length>1?'s':'')+' you can undo.':'That was the last one.'))}
function redoAll(){const h=fut.pop();if(!h)return msg('Nothing to redo.');hist.push({j:lastJ,lab:h.lab,t:Date.now()});histRestore(h.j);msg('Redid '+h.lab+'.')}
function histRestore(j){if(typeof fc!=='undefined'&&fc){clearInterval(fcT);fc=null}S=JSON.parse(j);lastJ=j;histAt=0;undoSnap=null;$('undoNP').hidden=true;try{localStorage.setItem(KEY,j)}catch(e){}save();histSave();render();if($('depv').style.display!=='none')depthRender()}
function undoRow(){return `<div class="row"><button id="undoLast" class="sec" style="flex:2;min-height:48px" onclick="undoAll()"${hist.length?'':' disabled'}>↶ Undo${hist.length?' '+esc(hist[hist.length-1].lab)+' ('+hist.length+')':''}</button><button class="sec" style="flex:1;min-height:48px" onclick="redoAll()"${fut.length?'':' disabled'}>Redo ↷</button></div>`}
function save(){const j=JSON.stringify(S);histNote(j);let ok=false;try{localStorage.setItem(KEY,j);ok=true}catch(e){}
 mirror(j);$('save').textContent=(PROF?'['+PROF+' profile] ':'')+(ok?'Saved on this phone '+ft(Date.now())+' · '+(S.piles.length+1)+' piles · v'+APPV.replace(/\D/g,''):'Not saved to main storage. Backup copy only: export now')}
let mirT;function mirror(j){clearTimeout(mirT);mirT=setTimeout(()=>{try{pdb().then(db=>{const tx=db.transaction('s','readwrite');tx.objectStore('s').put({t:Date.now(),j},'state'+(PROF?':'+PROF:''))})}catch(e){}},300)}
let undoSnap=null,undoT;function showUndoPile(){const u=$('undoNP');u.hidden=false;clearTimeout(undoT);undoT=setTimeout(()=>{u.hidden=true;undoSnap=null},20000)}
let msgT;function msg(t){const m=$('msg');m.textContent=t;m.hidden=false;clearTimeout(msgT);msgT=setTimeout(()=>m.hidden=true,6000)}
function log(type,data){const e={id:uid(),type,t:Date.now(),entered:Date.now(),pile:S.pile.id,pk:S.pile.key,strokes:S.strokes,...data};S.ev.push(e);return e}
function pev(type,key=S.pile.key){return S.ev.filter(e=>e.pk===key&&(!type||e.type===type))}
function tk(id){return S.trucks.find(t=>t.id===id)}
const tname=t=>t?(t.num||'#'+t.seq):'';
function vib(){try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
const seg=()=>Math.max(0,S.strokes-S.segStart);
function tStrokes(t){return t.strokes+(S.active===t.id?seg():0)}
function strokesOn(t,pk){return (t.ps[pk]||0)+(S.active===t.id&&pk===S.pile.key?seg():0)}
// Close the feeding truck's current stroke segment onto this pile
function closeSeg(){const t=tk(S.active);if(t){const d=seg();t.strokes+=d;t.ps[S.pile.key]=(t.ps[S.pile.key]||0)+d}S.segStart=S.strokes}
// About how many strokes a truck has left at the pump calibration
const sLeft=rem=>rem!==null&&calYd()>0?Math.max(0,Math.floor(rem/calYd())):null;
// Sample yd³ taken off a truck: its own value if set, else the Settings default
// Grout a truck brought into a pile = what it had left after the pile it came from (live, so later fixes flow through)
const cyd=(t,pk)=>{const c=t.carryIn&&t.carryIn[pk];if(!c)return null;const v=leftAfter(t,c.from);return v!==null?v:(c.yd??null)};
// Samples: one of S.sampleYd for every S.sampleEvery yd³ delivered that day (counting from yard 0), taken off the truck
// whose load crosses each mark. A value typed on a truck overrides this.
function autoSamples(){const out={},every=Number(S.sampleEvery)||0,at=t=>arrOf(t),day=t=>at(t)?new Date(at(t)).toDateString():new Date().toDateString(),cum={};
 const ts=[...S.trucks].sort((a,b)=>(at(a)||Infinity)-(at(b)||Infinity)||(a.seq||0)-(b.seq||0));
 for(const t of ts){if(t.rejected){out[t.id]=0;continue}const d=day(t),st=cum[d]||0,q=parseFloat(t.qty)||Number(S.defLoad)||0,en=st+q;cum[d]=en;
  let n=0;if(every>0){for(let k=Math.ceil(st/every)*every;k<en;k+=every)n++}else n=1;out[t.id]=n*(S.sampleYd||0)}return out}
const sy=t=>{const v=num(t.sampleYd);return v!==null?v:(autoSamples()[t.id]||0)};
const r1=v=>(Math.abs(v)<0.005?0:v).toFixed(3); // yd³ shown to 3 decimals like the field sheet
const num=v=>v===undefined||v===null||v===''?null:(parseFloat(v)||0);
// Used yd³ on one pile: typed amount wins, else strokes × calibration
// Strokes confirmed with the contractor: agreed total, else contractor count, else my count
// Piles in the order they were worked (you can reopen an older pile, so the current one isn't always last)
const allPiles=()=>[...S.piles,S.pile].sort((a,b)=>(a.n??0)-(b.n??0));
const orderKeys=()=>allPiles().map(p=>p.key);
const maxN=()=>Math.max(...allPiles().map(p=>p.n??0));
const isLatest=()=>(S.pile.n??0)>=maxN();
const latestPile=()=>allPiles().slice(-1)[0];
const pileRec=pk=>pk===S.pile.key?{...S.pile,strokes:S.strokes}:(S.piles.find(p=>p.key===pk)||{});
const bandSum=r=>{const v=Object.values(r.bandIn||{}).filter(x=>x!==''&&x!=null).map(Number);return v.length?v.reduce((a,b)=>a+b,0):null};
// From the depth lines: last counter reading + expected strokes for lines passed after it (auto when no reading was typed)
function lineTotal(r){const L=r.lines||[];if(!L.length)return null;const all=bands(r),bi=r.bandIn||{};if(all.length&&all.every(b=>bi[dl2(b)]!=null))return null;
 const last=L[L.length-1],withC=L.filter(l=>l.c!=null),lc=withC[withC.length-1];if(lc&&lc===last)return lc.c;const spf=spfOf(r);if(!spf)return lc?lc.c:null;
 return Math.round(lc?lc.c+spf*(lc.d-last.d):spf*((Number(r.len)||0)-last.d))}
const myCount=r=>{const m=num(r.myCount);if(m!==null)return m;const lt=lineTotal(r);if(r.tapped)return Math.max(lt||0,r.strokes||0);return lt!=null?lt:(bandSum(r)??(r.strokes||0))};
function confStrokes(pk){const r=pileRec(pk),a=num(r.reviewed),o=num(r.opCount);return a!==null?{n:a,src:'agreed total'}:o!==null?{n:o,src:'contractor count'}:{n:myCount(r),src:'my count'}}
// Each truck's share of the pile = its strokes on my counter, scaled to the confirmed total
function confOn(t,pk){const n=strokesOn(t,pk),my=pileRec(pk).strokes||0,cs=confStrokes(pk);
 if(my>0)return n*cs.n/my;
 // I didn't count this pile but the contractor did: fill trucks in the order they fed it, each up to what it had on board
 if(cs.n>0)return (seqAlloc(pk)[t.id])||0;return n}
function feedOrder(pk){const seen=[],add=id=>{if(id&&tk(id)&&!seen.includes(id))seen.push(id)};
 for(const e of pev(null,pk))if(e.type==='truck_carry'||e.type==='truck_switch')add(e.truck);
 if(pk===S.pile.key)add(S.active);
 // then trucks that were on site for this pile (arrived or carried in) as overflow, in arrival order
 for(const e of pev(null,pk))if(e.type==='truck_arrival'||e.type==='truck_carry')add(e.truck);
 // trucks waiting on site take over in the order they arrived (one truck pumps at a time)
 if(pk===S.pile.key)S.trucks.filter(t=>!t.pk0&&t.onsite&&!t.emptied).sort((a,b)=>(a.arrived||0)-(b.arrived||0)).forEach(t=>add(t.id));return seen}
function onBoard(t,pk){const order=orderKeys(),i=order.indexOf(pk),q=parseFloat(t.qty);if(!(q>=0))return Infinity;
 if(t.pk0===pk||i<=0)return q-sy(t);const prev=leftAfter(t,order[i-1]);return prev===null?Infinity:Math.max(0,prev)}
function seqAlloc(pk){const all=feedOrder(pk),c=confStrokes(pk).n,cy=calYd(),out={};let rest=c;
 // trucks with a typed used amount keep it; the rest of the strokes go to the others
 const ids=all.filter(id=>{const u=num(tk(id).used[pk]);if(u!==null&&cy>0){out[id]=u/cy;rest-=u/cy;return false}return true});rest=rest<0.5?0:rest; // under half a stroke is rounding
 ids.forEach((id,i)=>{const cap=cy>0?onBoard(tk(id),pk)/cy:Infinity,take=i===ids.length-1?rest:Math.min(rest,cap);out[id]=Math.max(0,take);rest-=out[id]});return out}
function usedOn(t,pk){const m=num(t.used[pk]);if(m!==null)return m;const n=confOn(t,pk);if(!n)return 0;const c=calYd();return c>0?n*c:null}
// Grout left on a truck at the end of a given pile (piles in the order worked)
// Field rule: grout a truck carries on to the next pile is rounded to 0.001 and taken down by 0.001

 S={pile:np,strokes:0,segStart:0,pumping:false,active:null,trucks:[],ev:[],piles:[],warned:{},orphan:0,plan:planLeft,...keep};applyPlan(S.pile,true);
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}save();scanClose();scrollTo(0,0);msg('Day saved. Ready for tomorrow'+(np.id?' starting at pile '+np.id:'')+'.')}
// Past days saved on the phone
async function pastDays(){try{const db=await pdb();return await new Promise(res=>{const out=[],q=db.transaction('s').objectStore('s').openCursor();q.onsuccess=()=>{const c=q.result;if(!c)return res(out.sort((a,b)=>b.v.t-a.v.t));if(String(c.key).startsWith(DAYK)&&!String(c.key).slice(DAYK.length).includes(':'))out.push({k:c.key,v:c.value});c.continue()};q.onerror=()=>res(out)})}catch(e){return[]}}
async function pastDaysOpen(){const ds=await pastDays();scanShow(`<h2>Past days</h2>${ds.length?ds.map(d=>`<div class="card"><b>${esc(d.v.date)}</b> · piles ${esc((d.v.piles||[]).join(', ')||'—')} · ${r1(d.v.used||0)} yd³<div class="row"><button class="sec" style="flex:1" onclick="pastDayGet('${d.k}','dl')">Download</button><button class="sec" id="pd-${esc(String(d.k).replace(/\W/g,''))}" style="flex:1" onclick="pastDayGet('${d.k}','open')">Open this day</button></div></div>`).join(''):'<div class="card">No past days yet. They appear here after End day.</div>'}<button class="sec" style="width:100%" onclick="scanClose()">Close</button>`)}
async function pastDayGet(k,what){const db=await pdb(),d=await new Promise(r=>{const q=db.transaction('s').objectStore('s').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});if(!d)return msg('That day wasn\'t found.');
 if(what==='dl'){offer('grout-day-'+String(d.date).replace(/\W/g,'-')+'.json',d.j,()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d.j],{type:'application/json'}));a.download='grout-day.json';a.click()});return}
 if(!twoTap('pd'+k,'pd-'+String(k).replace(/\W/g,''),'Tap again: open '+d.date+' (today is saved first)'))return;
 const cur=JSON.stringify(S);if(S.trucks.length||S.piles.length||confStrokes(S.pile.key).n){await new Promise(r=>{const tx=db.transaction('s','readwrite');tx.objectStore('s').put({t:Date.now(),date:today()+' (before opening '+d.date+')',piles:allPiles().map(p=>p.id),used:daySummary().used,j:cur},DAYK+Date.now());tx.oncomplete=r;tx.onerror=r})}
 localStorage.setItem(KEY,d.j);location.reload()}
function tick(){const now=Date.now();let worst=null;
 for(const t of S.trucks){if(t.emptied)continue;const co=cutoff(t);if(!co)continue;const r=co-now;if(r<=600000&&(!worst||r<worst.r))worst={t,r,co}}
 const a=$('alert');if(!worst){a.style.display='none';return}
 a.style.display='block';a.onclick=()=>issOpen(worst.t.id);
 if(worst.r<=0)a.textContent='▲ Truck '+tname(worst.t)+' — Cutoff reached ('+ft(worst.co)+')'+(usedAll(worst.t)>0.005?'':' · tap to send it back');
 else{const m=Math.floor(worst.r/60000),s=Math.floor(worst.r/1000)%60;a.textContent='▲ Truck '+tname(worst.t)+' — '+m+':'+String(s).padStart(2,'0')+' left · cutoff '+ft(worst.co)}
 if(!S.warned[worst.t.id]){S.warned[worst.t.id]=1;vib();noHist=true;save()}}
setInterval(tick,1000);
// If main storage came back empty but the backup copy has records, restore them
(async()=>{let had=false;try{had=!!localStorage.getItem(KEY)}catch(e){}
 if(!had){try{const db=await pdb();const b=await new Promise(r=>{const q=db.transaction('s').objectStore('s').get('state'+(PROF?':'+PROF:''));q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
  if(b&&b.j){localStorage.setItem(KEY,b.j);location.reload();return}}catch(e){}}
 render();tick();save();histLoad();preload();if(errList().length){const b=$('errb');if(b)b.hidden=false}})();
async function preload(){const PK='groutTracker.preloaded'+(PROF?':'+PROF:'');let done=[];try{done=JSON.parse(localStorage.getItem(PK)||'[]')}catch(e){}
 try{const r=await fetch('preload.json',{cache:'no-store'});if(!r.ok)return;const J=await r.json();for(const D of (J&&J.list)||[J])await preloadOne(D,done,PK)}catch(e){}}
// Save whatever day is on the phone to Past days and start a clean one (settings kept). Used before loading a new day's sheets.
async function archiveDay(){const j=JSON.stringify(S),sm=daySummary();const db=await pdb();
 await new Promise((res,rej)=>{const tx=db.transaction('s','readwrite');tx.objectStore('s').put({t:Date.now(),date:(S.piles[0]&&S.piles[0].date)||today(),piles:sm.piles.map(p=>p.id),used:sm.used,j},DAYK+Date.now());tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
 const keep={};for(const k of ['cal','calUnit','limit','sampleYd','sampleEvery','defLoad','drillMin','groutMin','reinfMin','hideIntro','aiModel','planDef','gFactor','beep','relMin'])if(S[k]!==undefined)keep[k]=S[k];
 S={pile:{...blankPile(),n:0,id:'',len:23,marks:[20,15,10,5,0],dayStart:true},strokes:0,segStart:0,pumping:false,active:null,trucks:[],ev:[],piles:[],warned:{},orphan:0,plan:[],...keep};save()}
async function preloadOne(D,done,PK){try{if(!D||!D.preloadId||done.includes(D.preloadId))return;
  // only on the day it's for (local date YYYY-MM-DD); other days it waits, unused
  if(D.onlyOn){const d=new Date(),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(k!==D.onlyOn)return}
  // the phone still holds an earlier day: keep it in Past days and start today clean
  if(D.freshDay){const td=new Date().toDateString(),old=S.ev.some(e=>e.t&&new Date(e.t).toDateString()!==td)||S.trucks.some(t=>t.arrived&&new Date(t.arrived).toDateString()!==td);
   if((old||D.replaceDay)&&(S.piles.length||S.trucks.length||!pileEmpty())){try{await archiveDay()}catch(e){logErr(e,'preload archive');return}}}
  // a sheet read ahead of time: filled in exactly like Scan filled-in form, on whatever is on this phone
  if(D.sheetFill){const ids=[];for(const p of D.sheetFill){const v=aiToGrid(p);gotoPile(v.pid[0]);if(v.len){const L=parseFloat(v.len[0]);if(L>0)setLen(S.pile,L)}formGrid(v,'(read by Claude)','',null);formApply(false);ids.push(v.pid[0])}
   for(const [k,v] of Object.entries(D.setAll||{})){for(const p of allPiles())if(ids.includes(p.id))p[k]=v}
   if(D.planDef)S.planDef={...(S.planDef||{}),...D.planDef};
   // a truck emptied on a pile whose form doesn't have its column
   for(const [seq,pid,hhmm] of D.truckEmpties||[]){const t=S.trucks.filter(x=>String(x.seq)===String(seq)).pop(),pp=allPiles().find(x=>x.id===pid);if(!t||!pp)continue;
    const [h,m]=hhmm.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);t.emptied=d.getTime();delete t.pend;if(S.active===t.id)S.active=null;log('truck_empty',{truck:t.id,pk:pp.key,source:'form'})}
   for(const [seq,pid] of D.moveTrucks||[]){const t=S.trucks.filter(x=>String(x.seq)===String(seq)).pop(),pp=allPiles().find(x=>x.id===pid);if(t&&pp)A.movePile(t.id,pp.key)}
   const L=latestPile();if(L.key!==S.pile.key)A.openPile(L.key);done.push(D.preloadId);localStorage.setItem(PK,JSON.stringify(done));save();render();msg('Loaded your sheet: piles '+ids.join(', ')+'. Now on pile '+(S.pile.id||'?')+'.');return}
  if(D.dropPiles){const notes=[];for(const [id,into] of D.dropPiles){const all=allPiles(),a=all.find(x=>x.id===id),b=all.find(x=>x.id===into);if(a&&b){armed['dp'+a.key]=Date.now();A.dropPile(a.key,b.key);notes.push('pile '+id+' removed (folded into '+into+')')}}
   done.push(D.preloadId);localStorage.setItem(PK,JSON.stringify(done));save();render();if(notes.length)msg(notes.join('; ')+'.');return}
  if(D.renamePiles){const notes=[];for(const [from,to] of D.renamePiles){const all=allPiles(),pf=all.find(x=>x.id===from);if(pf&&!all.some(x=>x.id===to)){pf.id=to;notes.push('pile '+from+' is now pile '+to)}}
   resortPiles();done.push(D.preloadId);localStorage.setItem(PK,JSON.stringify(done));save();render();msg((notes.join('; ')||'No pile to rename')+(D.note?' '+D.note:'')+'.');return}
  if(D.patch){const notes=[];for(const p of D.trucks||[]){let t=S.trucks.filter(x=>String(x.seq)===String(p.seq)).sort((a,b)=>(b.arrived||0)-(a.arrived||0))[0];
    if(!t&&p.add){A.addTruck();t=S.trucks[S.trucks.length-1];t.seq=p.seq;notes.push('added truck '+p.seq)}
    if(t&&p.batch&&t.batch!==p.batch){notes.push('truck '+p.seq+' batch '+(t.batch||'—')+' → '+p.batch);t.batch=p.batch;log('edit',{truck:t.id,field:'batch',value:p.batch,source:'patch'})}}
   done.push(D.preloadId);localStorage.setItem(PK,JSON.stringify(done));save();render();msg('Updated: '+(notes.join('; ')||'nothing to change')+'.');return}
  const ids=impMerge(D);done.push(D.preloadId);localStorage.setItem(PK,JSON.stringify(done));render();msg('Loaded your sheets: piles '+ids.join(', ')+'. Now on pile '+(S.pile.id||'?')+'.')}catch(e){}}
